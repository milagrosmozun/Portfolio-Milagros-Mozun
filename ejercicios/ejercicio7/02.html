<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2: Grilla Avanzada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos personalizados para emular los colores del esquema */
        .bg-verde-claro { background-color: #c0ebd7; }
        .bg-rosa-suave { background-color: #ffd2d6; }
        .bg-celeste { background-color: #bbf2f6; }
        .bg-gris { background-color: #e5e5ea; }
        .bg-azul-tarjeta { background-color: #c4e4ff; }
        
        .bloque {
            padding: 15px;
            text-align: center;
            font-weight: 500;
            border-radius: 4px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .tarjeta-azul {
            min-height: 80px;
        }
    </style>
</head>
<body>

    <div class="container my-4">
        <div class="row g-3 mb-3">
            <div class="col-12">
                <div class="bloque bg-verde-claro">header</div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 d-block d-sm-none">
                <div class="bloque bg-rosa-suave">banner mobile</div>
            </div>
            
            <div class="col-12">
                <div class="bloque bg-celeste">banner interno</div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
                <div class="bloque bg-gris">columna izquierda</div>
            </div>
            <div class="col-12 col-md-6">
                <div class="bloque bg-gris">columna derecha</div>
            </div>
        </div>

        <div class="row g-3 row-cols-2 row-cols-sm-3 row-cols-md-5 mb-3">
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 1</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 2</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 3</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 4</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 5</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 6</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 7</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 8</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 9</div></div>
            <div class="col"><div class="bloque bg-azul-tarjeta tarjeta-azul">col 10</div></div>
        </div>

        <div class="row g-3">
            <div class="col-12">
                <div class="bloque bg-verde-claro">footer</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
