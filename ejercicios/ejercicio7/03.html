<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3: Grilla y Clases Auxiliares</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos de colores según el esquema */
        .bg-verde-header { background-color: #0f8b4c; color: white; }
        .bg-gris { background-color: #e5e5ea; }
        .bg-celeste-banner { background-color: #00c2f3; color: white; }
        .bg-amarillo { background-color: #ffc107; }
        .bg-rojo { background-color: #ff434a; color: white; }
        
        .bloque {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-radius: 2px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .altura-rojo {
            min-height: 100px;
        }
    </style>
</head>
<body>

    <div class="container my-4">
        
        <div class="row mb-3">
            <div class="col-12">
                <div class="bloque bg-verde-header">Header</div>
            </div>
        </div>

        <div class="row g-3 mb-3 justify-content-sm-start justify-content-md-center justify-content-md-between">
            <div class="col-6 col-sm-3 col-md-3">
                <div class="bloque bg-gris">1</div>
            </div>
            <div class="col-6 col-sm-3 col-md-3">
                <div class="bloque bg-gris">2</div>
            </div>
            
            <div class="w-100 d-none d-md-block"></div>

            <div class="col-6 col-sm-3 col-md-3">
                <div class="bloque bg-gris">3</div>
            </div>
            <div class="col-6 col-sm-3 col-md-3">
                <div class="bloque bg-gris">4</div>
            </div>
        </div>

        <div class="row mb-3 d-none d-sm-block d-md-none">
            <div class="col-12">
                <div class="bloque bg-celeste-banner">tablet</div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-6 col-sm-3 col-md-3 order-md-4">
                <div class="bloque bg-amarillo">a</div>
            </div>
            <div class="col-6 col-sm-3 col-md-3 order-md-3">
                <div class="bloque bg-amarillo">b</div>
            </div>
            <div class="col-6 col-sm-3 col-md-3 order-md-2">
                <div class="bloque bg-amarillo">c</div>
            </div>
            <div class="col-6 col-sm-3 col-md-3 order-md-1">
                <div class="bloque bg-amarillo">d</div>
            </div>
        </div>

        <div class="row mb-3 d-block d-sm-none">
            <div class="col-12">
                <div class="bloque bg-celeste-banner">mobile</div>
            </div>
        </div>

        <div class="row mb-3 d-none d-md-block">
            <div class="col-12">
                <div class="bloque bg-celeste-banner">desktop</div>
            </div>
        </div>

        <div class="row g-3 mb-3 justify-content-center">
            <div class="col-sm-6 col-md-4 d-none d-sm-block">
                <div class="bloque bg-rojo altura-rojo">:(</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4">
                <div class="bloque bg-rojo altura-rojo">:D</div>
            </div>
        </div>

        <div class="row d-none d-sm-block">
            <div class="col-12">
                <div class="bloque bg-verde-header">footer</div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
